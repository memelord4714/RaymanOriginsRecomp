workflows:
  ios-build:
    name: Rayman iOS Build
    max_build_duration: 15
    instance_type: mac_mini_m2
    scripts:
      - name: Generate Xcode Project
        script: |
          mkdir build && cd build
          cmake -G Xcode -DCMAKE_SYSTEM_NAME=iOS ..
      - name: Build Unsigned App
        script: |
          cd build
          xcodebuild -project *.xcodeproj -scheme RaymanOrigins -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Release-iphoneos/*.app
