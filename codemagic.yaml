workflows:
  ios-build-v7:
    name: Rayman Universal Makefile Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Sync Code and Setup Placeholder
        script: |
          git submodule update --init --recursive --force
          mkdir -p recomp/ppc
          if [ ! -f recomp/ppc/ppc_func_mapping.cpp ]; then
            echo "// Generated Placeholder Bypass" > recomp/ppc/ppc_func_mapping.cpp
          fi
      - name: Configure Internal Engine Dependencies
        script: |
          rm -rf build && mkdir build && cd build
          # Switch generator to Unix Makefiles (Always installed on macOS)
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            ..
      - name: Compile and Package App Bundle
        script: |
          cd build
          # Compile natively using standard make threads
          cmake --build . --config Release
    artifacts:
      - build/*.app
      - build/Release-iphoneos/*.app




