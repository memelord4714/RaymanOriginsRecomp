workflows:
  ios-rayman-recomp:
    name: Rayman Origins Recomp iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: "com.yourname.raymanoriginsrecomp"
    scripts:
      - name: Initialize and Sync Submodules
        script: |
          git submodule update --init --recursive
          
      - name: Patch C++ Source for iOS Compatibility
        script: |
          echo "Patching macro definitions for iOS cross-compilation..."
          # Fix missing global context refs inside the static recompilation kernel layer
          sed -i '' 's/HostToGuestFunction<function>(ctx, base)/HostToGuestFunction<function>(nullptr, nullptr)/g' runtime/kernel/function.h
          
      - name: Configure CMake for iOS Target
        script: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID

      - name: Compile and Package App Bundle
        script: |
          cd build
          cmake --build . --config Release --target rayman
          
    artifacts:
      - build/**/*.ipa
      - build/**/*.app






























