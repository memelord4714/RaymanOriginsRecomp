workflows:
  ios-build-v5:
    name: Rayman Ninja Compile
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Force Create Missing Code Links
        script: |
          mkdir -p recomp/ppc
          echo "// Generated Placeholder Bypass" > recomp/ppc/ppc_func_mapping.cpp
          git submodule update --init --recursive --force
      - name: Configure Internal Engine Dependencies
        script: |
          mkdir -p build && cd build
          # Switch the generator from -G Xcode to -G Ninja
          cmake -G Ninja \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            ..
      - name: Compile and Package App Bundle
        script: |
          cd build
          # Use cmake's native builder instead of Xcode's compiler tool
          cmake --build . --config Release
    artifacts:
      - build/*.app



