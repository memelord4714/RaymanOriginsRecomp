workflows:
  ios-rayman-recomp:
    name: Rayman Origins Recomp iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        # Secure variables are loaded automatically if configured in the UI,
        # but you can also list your group here if using variable groups.
        XCODE_SCHEME: "rayman"
    scripts:
      - name: Initialize and Sync Submodules
        script: |
          git submodule update --init --recursive
          
      - name: Patch Kernel Macros for iOS Clang
        script: |
          echo "Fixing compiler macro issues..."
          sed -i '' 's/HostToGuestFunction<function>(ctx, base)/HostToGuestFunction<function>(nullptr, nullptr)/g' runtime/kernel/function.h

      - name: Download and Extract Original Game Assets
        script: |
          echo "Fetching private game assets from secure variable link..."
          mkdir -p game
          # Downloads your zip securely into the build instance
          curl -L -o game_assets.zip "$GAME_ASSETS_URL"
          # Unzips the game files (default.xex) directly into the target folder
          unzip game_assets.zip -d ./game/
          rm game_assets.zip

      - name: Build Recompiler Tool on Mac Host
        script: |
          echo "Building the desktop recompiler backend tool..."
          mkdir -p tools_build
          cd tools_build
          cmake .. -DBUILD_RECOMPILER_ONLY=ON
          cmake --build . --config Release

      - name: Run Recompiler to Decompile Game Binary
        script: |
          echo "Processing default.xex to generate real C++ source files..."
          mkdir -p recomp/ppc
          # Point the tool to your extracted game folder or default.xex path
          # (Adjust the input flag syntax if the repository uses a specific flag like --input)
          ./tools_build/recompiler --input ./game/default.xex --output ./recomp/ppc/

      - name: Configure CMake for iOS Target
        script: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -G Xcode

      - name: Compile and Package App Bundle
        script: |
          cd build
          cmake --build . --config Release --target rayman
          
    artifacts:
      - build/**/*.ipa
      - build/**/*.app

































