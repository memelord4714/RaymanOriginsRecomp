workflows:
  ios-build-v10:
    name: Rayman Metal Graphics Only
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Sync Code and Overwrite Broken Files
        script: |
          git submodule update --init --recursive --force
          mkdir -p recomp/ppc
          if [ ! -f recomp/ppc/ppc_func_mapping.cpp ]; then
            echo "// Generated Placeholder Bypass" > recomp/ppc/ppc_func_mapping.cpp
          fi
          echo "// Stripped out via brute force bypass" > thirdparty/SDL/src/dynapi/SDL_dynapi.c
          echo "// Stripped out via brute force bypass" > thirdparty/SDL/src/dynapi/SDL_dynapi.h
      - name: Configure Internal Engine Dependencies
        script: |
          rm -rf build && mkdir build && cd build
          # Disabling OpenGL drivers forces the compiler to rely solely on Apple's native Metal rendering
          cmake -G "Unix Makefiles" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DSDL_DYNAPI=OFF \
            -DSDL_DYNAMICAPI=OFF \
            -DSDL_OPENGL=OFF \
            -DSDL_OPENGLES=OFF \
            -DSDL_OPENGLES2=OFF \
            ..
      - name: Compile and Package App Bundle
        script: |
          cd build
          cmake --build . --config Release
    artifacts:
      - build/*.app
      - build/Release-iphoneos/*.app






