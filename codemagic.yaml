    scripts:
      - name: Initialize and Sync Submodules
        script: |
          git submodule update --init --recursive
          
      - name: Patch C++ Source for iOS Compatibility
        script: |
          echo "Patching macro definitions for iOS cross-compilation..."
          sed -i '' 's/HostToGuestFunction<function>(ctx, base)/HostToGuestFunction<function>(nullptr, nullptr)/g' runtime/kernel/function.h

      - name: Build Recompiler Generator Utility
        script: |
          echo "Building the host recompiler tool to generate source files..."
          # The recompiler engine itself must be built for the macOS build machine first, NOT iOS
          mkdir -p tools_build
          cd tools_build
          cmake .. -DBUILD_RECOMPILER_ONLY=ON
          cmake --build . --config Release --target recompiler
          
      - name: Run Recompiler to Generate Source Files
        script: |
          echo "Generating ppc_func_mapping.cpp..."
          # Execute the compiled tool to generate the missing source files.
          # Note: This step typically requires you to provide the original game files/ROM 
          # in the path specified by the project documentation.
          ./tools_build/recompiler --output ./recomp/ppc/
          
      - name: Configure CMake for iOS Target
        script: |
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_XCODE_ATTRIBUTE_DEVELOPMENT_TEAM=$DEVELOPMENT_TEAM \
            -DCMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID

      - name: Compile and Package App Bundle
        script: |
          cd build
          cmake --build . --config Release --target rayman































