workflows:
  ios-build:
    name: Rayman iOS Self-Contained Build
    max_build_duration: 20
    instance_type: mac_mini_m2
    scripts:
      - name: Fetch Portable Dependencies
        script: |
          mkdir -p dependencies && cd dependencies
          # Download portable SDL3 framework for iOS directly
          curl -L -o sdl3.zip https://github.com
          unzip sdl3.zip
      - name: Generate Xcode Project
        script: |
          mkdir build && cd build
          cmake -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DSDL3_DIR=$(pwd)/../dependencies/SDL3.xcframework \
            ..
      - name: Build Unsigned App
        script: |
          cd build
          xcodebuild -project *.xcodeproj -scheme RaymanOrigins -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO
    artifacts:
      - build/Release-iphoneos/*.app


