workflows:
  ios-build-v3:
    name: Rayman Submodule Force Fix
    max_build_duration: 30
    instance_type: mac_mini_m2
    scripts:
      - name: Sync Missing Subfolders
        script: |
          # Force the cloud computer to deeply pull the missing Xbox translation folders
          git submodule update --init --recursive --force
      - name: Configure Internal Engine Dependencies
        script: |
          mkdir build && cd build
          cmake -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DBUILD_SHARED_LIBS=OFF \
            -DXENON_RECOMP_BUILD_RECOMP=ON \
            ..
      - name: Compile and Package App Bundle
        script: |
          cd build
          xcodebuild -project *.xcodeproj -scheme RaymanOrigins -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
    artifacts:
      - build/Release-iphoneos/*.app

